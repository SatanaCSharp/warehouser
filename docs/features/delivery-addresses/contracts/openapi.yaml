openapi: 3.1.0

info:
  title: Delivery Addresses API
  version: 0.1.0
  description: |
    `ordering` shipped the loop this API attaches to: demand recorded per customer, consolidated per
    Item, answered by a Purchase Draft a member assembles, frozen when the supplier is phoned, and
    closed when the goods arrive. Nothing in it says **where** anything goes. A Customer Order carries
    a typed `customerName` and no address, a Purchase Draft Line carries an Item and a quantity and no
    destination, a Warehouse carries a name, and one whole-draft arrival is the single act that ends a
    draft.

    This API adds the destination. It introduces two durable records a Warehouse owns — the Customer
    and its Delivery Addresses — gives the Warehouse itself one Delivery Address, puts a Delivery Mode
    and a Delivery Address on every Purchase Draft Line, freezes both with the rest of the line,
    reports Address Drift when the demand behind a frozen line moves, and replaces the whole-draft
    arrival with an ending recorded per line.

    Five shapes are load-bearing and readable from the paths below.

    - **Customer identity is a new confidentiality boundary, enforced by an observed Permission.**
      A read that can carry a customer name, a Delivery Address, an access note or a count of them
      declares `CUSTOMERS:WATCH` as an **observed** Permission beside the Permission it requires
      ([ADR 0001](../adr/0001-observed-permission-redaction.md)). An observed Permission never denies:
      the request succeeds either way, and the projection is built from the observed Permissions the
      actor actually holds. Every such response is modelled as `oneOf` an **identified** and a
      **redacted** form, and the redacted form **omits** the identity properties rather than nulling
      them — so a redaction failure fails contract validation on the way out instead of reaching a
      screen (AC-09a, sad.md §7).
    - **The Warehouse's own Delivery Address is not customer identity.** It is the operator's own
      premises data. It is *written* at the Workspace prefix under `WAREHOUSES:ADDRESS_UPDATE`,
      because its subject is the Warehouse record and `WorkspaceAccessGuard` is what resolves a
      Workspace Permission; it is *read* from the Warehouse-scoped draft and line projections under
      `PURCHASE_DRAFTS:WATCH` and is **never** gated on `CUSTOMERS:WATCH` — which is why a line's
      destination is two properties, `warehouseDestination` and `customerDestination`, rather than one
      (AC-10, sad.md §7).
    - **A line's ending is per line and its kind is a routing fact.** `POST …/lines/{id}/arrival` and
      `POST …/lines/{id}/direct-delivery` replace the withdrawn whole-draft
      `POST /purchase-drafts/{id}/arrival`. AC-20's refusal — which of the two ways that line's goods
      travelled — is decided by the path rather than by a value the member submitted, and the draft
      moves to Closed in the same transaction as the ending of its **last** line
      ([ADR 0002](../adr/0002-per-line-purchase-draft-endings.md)).
    - **Redirection is its own sub-resource**, `PUT /customer-orders/{id}/delivery-address`, not a
      field on the amendment `PATCH`. AC-11c's rules — the same Customer, an active address, an
      outstanding order — are the redirection's rules and not the amendment's, and a shared payload
      would let one path's validation stand in for the other's.
    - **Address Drift is derived on every read and never stored.** It is a value comparison between
      each link's captured Delivery Address and the address that Customer Order is going to at the
      instant of the read. No endpoint accepts it as input, and redirecting the order back to the
      frozen address stops the report (AC-18, AC-18a).

    **Lists are returned whole and deterministically ordered, not paged**, at the `spec.md` §1 scale —
    roughly 500 Customers and 1 500 Delivery Addresses per Warehouse on top of what `ordering` already
    assumes. See `api-sync-report.md` § "Recorded deviations".

    **Scope of this document.** It restates every operation this feature adds, and every `ordering`
    operation whose request, error set or declared Permissions this feature changes. `ordering`
    operations it does not restate are unchanged and stay governed by
    [`ordering/contracts/openapi.yaml`](../../ordering/contracts/openapi.yaml).

    This feature introduces no queue, event, scheduled job or third-party callback (sad.md §6), so
    there is no asynchronous contract and no `events.md`.

servers:
  - url: http://localhost:3000
    description: Local development

# Every operation requires the session cookie issued by `POST /api/v1/auth/sign-up` and
# `POST /api/v1/auth/sign-in`. This feature introduces no public endpoint, so no operation
# overrides with `security: []`. Authentication grants no authority: a valid session with no
# membership in the named Warehouse is denied every capability here, reads included (sad.md §6.1).
security:
  - SessionCookie: []

tags:
  - name: customers
    description: |
      Customers of a Warehouse, their Delivery Addresses, and what each customer is still waiting for.
      Every operation here requires a `CUSTOMERS:*` Permission, so no redaction applies: an actor who
      reaches these paths at all already holds the Permission the identity is gated on.
  - name: warehouse-delivery-address
    description: |
      The Warehouse's own Delivery Address and access notes — the operator's own premises data,
      written at the **Workspace** prefix under `WAREHOUSES:ADDRESS_UPDATE`.
  - name: customer-orders
    description: |
      Recording demand against a Customer and a Delivery Address, redirecting an outstanding order,
      and the consolidated demand read. Identity-bearing; each declares `CUSTOMERS:WATCH` observed.
  - name: purchase-drafts
    description: |
      Delivery Mode and Delivery Address on a line, the freeze that captures both, Address Drift, the
      by-line split, and the per-line endings. Identity-bearing; each read declares `CUSTOMERS:WATCH`
      observed.

paths:
  ##########################################################################################
  # Customers — the record demand and directly-shipped lines both name
  ##########################################################################################

  /api/v1/warehouses/{warehouseId}/customers:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    get:
      tags: [customers]
      summary: List the Warehouse's Customers
      description: |
        Every Customer of the named Warehouse ordered by name, each with its Delivery Addresses and
        which of them is Main. Requires `CUSTOMERS:WATCH`; a member whose Role does not carry it is
        denied without learning that any Customer exists, and no count of Customers or Delivery
        Addresses reaches them through any other surface either (AC-09, spec.md §6.1 "Customer
        disclosure through a count").

        `active=true` narrows the response to Customers that are not Inactive — the picker read used
        while recording demand (AC-06). Without it the response carries active and Inactive Customers
        alike, because a Customer Order already naming an Inactive Customer stays readable and keeps
        counting exactly as before.

        Archived-tolerant: a member whose Role carries `CUSTOMERS:WATCH` reads an archived
        Warehouse's Customers exactly as before archiving (AC-23).
      operationId: listCustomers
      parameters:
        - in: query
          name: active
          required: false
          description: "`true` returns only Customers that may still be selected when demand is recorded."
          schema: { type: boolean }
      responses:
        "200":
          description: The Warehouse's Customers, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
              example:
                - id: "00000000-0000-4000-8000-000000000201"
                  name: "Test Customer North"
                  deactivatedAt: null
                  mainDeliveryAddressId: "00000000-0000-4000-8000-000000000301"
                  deliveryAddresses:
                    - id: "00000000-0000-4000-8000-000000000301"
                      customerId: "00000000-0000-4000-8000-000000000201"
                      addressText: "Test Address 1, Test City"
                      accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                      isMain: true
                      deactivatedAt: null
                      createdAt: "2026-09-01T08:00:00.000Z"
                      updatedAt: "2026-09-01T08:00:00.000Z"
                  recordedByUserId: "00000000-0000-4000-8000-000000000001"
                  createdAt: "2026-09-01T08:00:00.000Z"
                  updatedAt: "2026-09-01T08:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [customers]
      summary: Record a Customer with its first Delivery Address
      description: |
        Requires `CUSTOMERS:CREATE`. One transaction writes the Customer as active and its first
        Delivery Address as active and Main, with the recording member and the time (AC-01). The
        Customer becomes selectable when demand is recorded.

        A name that is empty after trimming, or an address text that is, is refused and nothing is
        changed (AC-02). A name already held in this Warehouse — by an active **or** an Inactive
        Customer — is refused, naming the Customer that holds it (AC-03); the per-Warehouse uniqueness
        constraint is the final arbiter under concurrency and maps to the same refusal. The same name
        in another Warehouse is not a conflict, is never consulted, and is never disclosed (AC-03a).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited on the same terms
        as the `ordering` mutations.
      operationId: recordCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
            example:
              name: "Test Customer North"
              deliveryAddress:
                addressText: "Test Address 1, Test City"
                accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
      responses:
        "201":
          description: The recorded Customer with its first Delivery Address as its Main one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: null
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000301"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-01T08:00:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-01T08:00:00.000Z"
        "400": { $ref: "#/components/responses/InvalidCustomerInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "409": { $ref: "#/components/responses/CustomerWriteConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerIdPath"

    get:
      tags: [customers]
      summary: Read one Customer with everything it is waiting for
      description: |
        Requires `CUSTOMERS:WATCH`. Returns the Customer, its Delivery Addresses, and every
        **Unfulfilled** Customer Order of that Customer with its Item, Outstanding Quantity,
        needed-by date and the Delivery Address it is going to; Fulfilled and cancelled orders are
        omitted (AC-08).

        Each awaiting row's destination also reports *why* it is that address: `isMain` says it is the
        Customer's current Main one, and `deactivatedAt` says the address the order names has since
        been made Inactive — the order keeps naming it and keeps counting exactly as before (AC-06a).

        Archived-tolerant (AC-23).
      operationId: readCustomer
      responses:
        "200":
          description: The Customer, its Delivery Addresses, and its Unfulfilled Customer Orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerDetail" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: null
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000301"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-01T08:00:00.000Z"
                  - id: "00000000-0000-4000-8000-000000000302"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 2, Test Town"
                    accessNotes: null
                    isMain: false
                    deactivatedAt: null
                    createdAt: "2026-09-01T09:00:00.000Z"
                    updatedAt: "2026-09-01T09:00:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-01T08:00:00.000Z"
                awaitingCustomerOrders:
                  - customerOrderId: "00000000-0000-4000-8000-000000000601"
                    itemId: "00000000-0000-4000-8000-000000000101"
                    itemSku: "TEST-SKU-0001"
                    itemDescription: "Test Item - 2 m cable"
                    unitOfMeasure: "metres"
                    outstandingQuantity: 40
                    neededBy: "2026-09-20"
                    destination:
                      deliveryAddressId: "00000000-0000-4000-8000-000000000301"
                      addressText: "Test Address 1, Test City"
                      accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                      isMain: true
                      deactivatedAt: null
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [customers]
      summary: Correct a Customer's name
      description: |
        Requires `CUSTOMERS:UPDATE`. The correction is recorded and **nothing that names the Customer
        is touched**: every Customer Order and every frozen Purchase Draft Line names the Customer's
        identifier and never its name, so no cascade exists and none is needed (AC-03b).

        A name already held by another Customer of this Warehouse — active or Inactive — is refused
        and the Customer is left exactly as it was (AC-03c).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: correctCustomerName
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
            example:
              name: "Test Customer North (Ltd)"
      responses:
        "200":
          description: The corrected Customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/InvalidCustomerInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/CustomerWriteConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customers/{customerId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerIdPath"

    post:
      tags: [customers]
      summary: Deactivate a Customer
      description: |
        Requires `CUSTOMERS:DEACTIVATE`. Records the Customer Inactive **whether or not it is still
        waiting for goods**, stops offering it when demand is recorded, keeps every Customer Order
        that already names it readable and counting exactly as before, leaves every one of its
        Delivery Addresses in the state it was already in, and keeps its name taken so no new Customer
        may reuse it (AC-06).

        A transition addressed as its own sub-resource rather than a field on `PATCH`, so it declares
        its own Permission (sad.md §7).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: deactivateCustomer
      responses:
        "200":
          description: The Inactive Customer; its Delivery Addresses are untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: "2026-09-02T12:00:00.000Z"
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000301"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-01T08:00:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-02T12:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/WarehouseArchived" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [customers]
      summary: Make a Customer active again
      description: |
        Requires `CUSTOMERS:DEACTIVATE` — the same Permission governs both directions, because
        reactivation is the same operation inverted (AC-06, sad.md §6.3). Clears `deactivatedAt`; the
        Customer is offered again when demand is recorded and its Delivery Addresses are, once more,
        in whatever state they were left in.

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: reactivateCustomer
      responses:
        "200":
          description: The active Customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: null
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000301"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-01T08:00:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-01T08:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/WarehouseArchived" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customers/{customerId}/delivery-addresses:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerIdPath"

    post:
      tags: [customers]
      summary: Add a Delivery Address to a Customer
      description: |
        Requires `CUSTOMERS:UPDATE`. Records the address as active against that Customer. With
        `main: true` the same transaction clears the previous Main flag, so **exactly one active
        address is Main at every instant** — the partial-unique index over `(customer_id) WHERE
        is_main` is the arbiter under concurrency (AC-04, AC-05).

        Both addresses are then offered wherever a Delivery Address is chosen. Address text and access
        notes are stored as submitted and rendered as text, never as markup and never as a link; gate
        and door codes recorded there are confidential data of the same classification as the Customer
        carrying them and appear in no log line, no error detail and no denial payload
        (spec.md §6.1, sad.md §8).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: addCustomerDeliveryAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerDeliveryAddressCreate" }
            example:
              addressText: "Test Address 2, Test Town"
              accessNotes: "Rear yard; call the site office on arrival"
              main: true
      responses:
        "201":
          description: The Customer with both addresses, the new one now Main and the previous one no longer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/InvalidCustomerInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/WarehouseArchived" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customers/{customerId}/delivery-addresses/{deliveryAddressId}:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerIdPath"
      - $ref: "#/components/parameters/CustomerDeliveryAddressIdPath"

    patch:
      tags: [customers]
      summary: Correct a Delivery Address in place
      description: |
        Requires `CUSTOMERS:UPDATE`. Corrects the address text or its access notes. Every Customer
        Order and every **live** Purchase Draft Line naming this address follows the correction,
        because they hold a reference to it.

        A **frozen** Purchase Draft Line does not: its Delivery Address was captured as text at Ready
        for Ordering, so no edit in place can travel into it and the record keeps saying what the
        supplier was actually told (AC-16, AC-17, data-model.md `purchase_draft_lines`).

        Correcting a typo is **not** Address Drift: drift is an identity comparison between the
        address a link was frozen against and the address that Customer Order is going to now
        (data-model.md `purchase_draft_demand_snapshots`), so this operation reports none.

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: correctCustomerDeliveryAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerDeliveryAddressUpdate" }
            example:
              addressText: "Test Address 2, Test Town, Unit 4"
              accessNotes: null
      responses:
        "200":
          description: The Customer with the corrected address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/InvalidCustomerInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/WarehouseArchived" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customers/{customerId}/delivery-addresses/{deliveryAddressId}/main:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerIdPath"
      - $ref: "#/components/parameters/CustomerDeliveryAddressIdPath"

    put:
      tags: [customers]
      summary: Mark a Delivery Address as the Customer's Main one
      description: |
        Requires `CUSTOMERS:UPDATE`. One transaction sets this address Main and clears the previous
        Main flag (AC-04, AC-05). An Inactive address is refused: `chk_customer_delivery_addresses_
        main_is_active` holds that an Inactive address is never the Main one, so a once-Main address
        that is reactivated comes back as an ordinary address rather than as a second Main one.

        Idempotent — marking the address that is already Main changes nothing and returns the same
        Customer, which is why this is `PUT` and carries no body.

        **Marking a different address Main moves no existing Customer Order.** An order names an
        address, not "the Main one"; the Main address is resolved and stored as a reference at record
        time (data-model.md `customer_orders`, CONTEXT.md §Invariants).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: setMainCustomerDeliveryAddress
      responses:
        "200":
          description: The Customer with its new Main Delivery Address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: null
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000302"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: false
                    deactivatedAt: null
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-02T11:00:00.000Z"
                  - id: "00000000-0000-4000-8000-000000000302"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 2, Test Town"
                    accessNotes: null
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T09:00:00.000Z"
                    updatedAt: "2026-09-02T11:00:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-01T08:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/CustomerDeliveryAddressConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customers/{customerId}/delivery-addresses/{deliveryAddressId}/deactivation:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerIdPath"
      - $ref: "#/components/parameters/CustomerDeliveryAddressIdPath"

    post:
      tags: [customers]
      summary: Deactivate one Delivery Address
      description: |
        Requires `CUSTOMERS:UPDATE` — maintaining a Customer's addresses is an aspect of updating the
        Customer, not of deactivating it (spec.md §6.1).

        The Customer's active addresses are read **under lock** and the condition re-evaluated at the
        moment the change is recorded, so two concurrent deactivations cannot both see two remaining
        (sad.md §6.3). Exactly one active address remaining → refused, naming the rule and the order to
        follow: add the replacement first, deactivate the old one afterwards (AC-07). This holds
        whether or not the Customer has Unfulfilled Customer Orders.

        Deactivating the **Main** address makes one of the remaining active addresses Main in the same
        transaction, and the response names which (AC-06b).

        Every Customer Order and every frozen Purchase Draft Line already naming the address keeps
        reading and counting exactly as before; it simply stops being offered wherever an address is
        chosen (AC-06a).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: deactivateCustomerDeliveryAddress
      responses:
        "200":
          description: |
            The Customer with the address now Inactive. `mainDeliveryAddressId` names the address that
            is Main now — which is a different one when the deactivated address was the Main one
            (AC-06b).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: null
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000302"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: false
                    deactivatedAt: "2026-09-02T12:30:00.000Z"
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-02T12:30:00.000Z"
                  - id: "00000000-0000-4000-8000-000000000302"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 2, Test Town"
                    accessNotes: null
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T09:00:00.000Z"
                    updatedAt: "2026-09-02T12:30:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-01T08:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/CustomerDeliveryAddressConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [customers]
      summary: Make a Delivery Address active again
      description: |
        Requires `CUSTOMERS:UPDATE`. Clears `deactivatedAt`; the address is offered again wherever one
        is chosen. It comes back as an **ordinary** address, never as a second Main one — which is
        `chk_customer_delivery_addresses_main_is_active` holding, not a rule the command remembers.

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: reactivateCustomerDeliveryAddress
      responses:
        "200":
          description: The Customer with the address active again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
              example:
                id: "00000000-0000-4000-8000-000000000201"
                name: "Test Customer North"
                deactivatedAt: null
                mainDeliveryAddressId: "00000000-0000-4000-8000-000000000302"
                deliveryAddresses:
                  - id: "00000000-0000-4000-8000-000000000301"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 1, Test City"
                    accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                    isMain: false
                    deactivatedAt: null
                    createdAt: "2026-09-01T08:00:00.000Z"
                    updatedAt: "2026-09-02T11:00:00.000Z"
                  - id: "00000000-0000-4000-8000-000000000302"
                    customerId: "00000000-0000-4000-8000-000000000201"
                    addressText: "Test Address 2, Test Town"
                    accessNotes: null
                    isMain: true
                    deactivatedAt: null
                    createdAt: "2026-09-01T09:00:00.000Z"
                    updatedAt: "2026-09-02T11:00:00.000Z"
                recordedByUserId: "00000000-0000-4000-8000-000000000001"
                createdAt: "2026-09-01T08:00:00.000Z"
                updatedAt: "2026-09-01T08:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerUnavailable" }
        "409": { $ref: "#/components/responses/WarehouseArchived" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  ##########################################################################################
  # The Warehouse's own Delivery Address — Workspace-scoped, and not customer identity
  ##########################################################################################

  /api/v1/workspace/warehouses/{warehouseId}/delivery-address:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    put:
      tags: [warehouse-delivery-address]
      summary: Record or correct the Warehouse's own Delivery Address
      description: |
        Requires the **Workspace** Permission `WAREHOUSES:ADDRESS_UPDATE`, resolved by
        `WorkspaceAccessGuard` over a Warehouse of the actor's Workspace. The subject of the operation
        is the Warehouse record itself, which `workspaces` already settles as a Workspace Capability
        alongside renaming and archiving.

        **This is the one flow in the feature that does not resolve through the Warehouse-scoped
        authorization spine.** A Warehouse Permission never authorizes it and a Workspace Permission
        never authorizes anything under `/api/v1/warehouses/{warehouseId}/customers` — the two
        vocabularies do not substitute for each other, and the fact that this path names a Warehouse
        must not be read as the Warehouse guard applying (sad.md §6 "Flags raised while drawing these
        flows", `workspaces` ADR 0001).

        A single-row update on the Warehouse, correcting the address in place when one already exists.
        There is no second address, no Main flag and no deactivation path: a Warehouse has exactly one
        Delivery Address and never makes it Inactive (AC-10, CONTEXT.md "Warehouse Delivery Address").

        `accessNotes` without `addressText` is refused — access notes describe how to get into a place,
        and there is no place until the address is recorded
        (`chk_warehouses_delivery_notes_require_address`).

        This address is what a Via Warehouse line is shown as travelling to, and a draft holding one
        cannot be frozen until it is recorded (AC-16a). Being the operator's own premises data, it is
        **read** under `PURCHASE_DRAFTS:WATCH` and is not gated on `CUSTOMERS:WATCH`.

        **Archived-tolerant**, and deliberately so: the subject of the operation is the Warehouse
        record itself, which `workspaces` already keeps writable while that Warehouse is archived
        alongside renaming it. AC-23 governs operations that change the resources a Warehouse *owns* —
        its Customers, its demand, its drafts — and this changes the record, not its contents.
      operationId: setWarehouseDeliveryAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseDeliveryAddressWrite" }
            example:
              addressText: "Test Warehouse North, Test Industrial Estate"
              accessNotes: "Dock 3; deliveries 07:00-15:00; report to the gatehouse"
      responses:
        "200":
          description: The Warehouse's one Delivery Address, correctable in place afterwards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseDeliveryAddress" }
              example:
                warehouseId: "00000000-0000-4000-8000-000000000010"
                addressText: "Test Warehouse North, Test Industrial Estate"
                accessNotes: "Dock 3; deliveries 07:00-15:00; report to the gatehouse"
        "400": { $ref: "#/components/responses/InvalidWarehouseDeliveryAddressInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WorkspaceDenied" }
        "404": { $ref: "#/components/responses/WorkspaceTargetUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  ##########################################################################################
  # Customer Orders — demand that knows where it is going
  ##########################################################################################

  /api/v1/warehouses/{warehouseId}/demand:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    get:
      tags: [customer-orders]
      summary: Read the consolidated demand
      description: |
        **Changed by this feature: authorization only.** Requires `CUSTOMER_ORDERS:WATCH` and now
        declares `CUSTOMERS:WATCH` **observed** (sad.md §7), because the demand surface as a whole
        carries customer identity through the Customer Orders behind each Demand Line.

        The aggregation shape `ordering` established is unchanged (sad.md §6.6 read note): a Demand
        Line remains one Item's consolidated Unfulfilled demand and carries no customer name, no
        Delivery Address and no count of either. The per-order customer and destination are read
        through `listCustomerOrders`, which is where the redaction of AC-09a and AC-24 lands.

        See `api-sync-report.md` § "Findings requiring your decision", Finding 1: under an unchanged
        aggregation shape this operation's observed Permission has no field to redact.

        Archived-tolerant (AC-23).
      operationId: readConsolidatedDemand
      responses:
        "200":
          description: One Demand Line per Item with Unfulfilled demand, ordered by earliest needed-by date.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DemandLine" }
              example:
                - itemId: "00000000-0000-4000-8000-000000000101"
                  sku: "TEST-SKU-0001"
                  description: "Test Item - 2 m cable"
                  unitOfMeasure: "metres"
                  totalOutstandingQuantity: 65
                  earliestNeededBy: "2026-09-20"
                  onHandQuantity: 12
                  unfulfilledCustomerOrderCount: 2
                  coverage:
                    - purchaseDraftId: "00000000-0000-4000-8000-000000000401"
                      purchaseDraftReference: "PD-0143"
                      purchaseDraftLineId: "00000000-0000-4000-8000-000000000411"
                      purchaseDraftState: "ready_for_ordering"
                      statedQuantity: 100
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customer-orders:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    get:
      tags: [customer-orders]
      summary: List Customer Orders, with the customer and destination of each
      description: |
        Requires `CUSTOMER_ORDERS:WATCH`, declaring `CUSTOMERS:WATCH` **observed**.

        Holding the observed Permission, each order reads with its Customer and the Delivery Address
        it is going to — or, for an order recorded by typed name, the typed name and **no** Delivery
        Address, that absence being what tells the member which kind of row they are looking at
        (AC-11a, AC-24). Both kinds read and count alike.

        Without it, the projection selects **no customer name of either kind, no address, no access
        note and no count of them**, while quantities, dates, Items and states are returned unchanged
        — the member keeps everything their own Permissions do admit (AC-09a). The redacted form omits
        those properties rather than nulling them.

        The `itemId` and `state` filters serve the sub-rows behind one Demand Line and the linkable
        orders a draft line may name; `deliveryAddressId` narrows to one destination, which is what a
        member assembling a Direct to Customer line needs (AC-15).

        Archived-tolerant (AC-23).
      operationId: listCustomerOrders
      parameters:
        - in: query
          name: itemId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: state
          required: false
          schema: { $ref: "#/components/schemas/CustomerOrderState" }
        - in: query
          name: customerId
          required: false
          description: |
            Narrows to the demand of one Customer. Rejected for an actor without `CUSTOMERS:WATCH`:
            filtering by a Customer identifier and reading the resulting count would answer "does this
            Customer exist" as effectively as the record does (spec.md §6.1 "Customer disclosure
            through a count").
          schema: { type: string, format: uuid }
        - in: query
          name: deliveryAddressId
          required: false
          description: |
            Narrows to the demand going to one Delivery Address. Rejected for an actor without
            `CUSTOMERS:WATCH`, for the same reason as `customerId`.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The Warehouse's Customer Orders, identified or redacted according to the observed Permission.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerOrder" }
              examples:
                identified:
                  summary: With `CUSTOMERS:WATCH` — a Customer-naming order and a typed-name order (AC-24)
                  value:
                    - id: "00000000-0000-4000-8000-000000000601"
                      itemId: "00000000-0000-4000-8000-000000000101"
                      customer:
                        id: "00000000-0000-4000-8000-000000000201"
                        name: "Test Customer North"
                      customerName: null
                      destination:
                        deliveryAddressId: "00000000-0000-4000-8000-000000000301"
                        addressText: "Test Address 1, Test City"
                        accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                        isMain: true
                        deactivatedAt: null
                      quantity: 100
                      outstandingQuantity: 40
                      neededBy: "2026-09-20"
                      state: "unfulfilled"
                      cancellationReason: null
                      recordedByUserId: "00000000-0000-4000-8000-000000000001"
                      cancelledByUserId: null
                      cancelledAt: null
                      createdAt: "2026-09-01T10:00:00.000Z"
                      updatedAt: "2026-09-01T10:00:00.000Z"
                    - id: "00000000-0000-4000-8000-000000000602"
                      itemId: "00000000-0000-4000-8000-000000000101"
                      customer: null
                      customerName: "Test Customer South"
                      destination: null
                      quantity: 25
                      outstandingQuantity: 25
                      neededBy: "2026-09-22"
                      state: "unfulfilled"
                      cancellationReason: null
                      recordedByUserId: "00000000-0000-4000-8000-000000000001"
                      cancelledByUserId: null
                      cancelledAt: null
                      createdAt: "2026-09-01T10:05:00.000Z"
                      updatedAt: "2026-09-01T10:05:00.000Z"
                redacted:
                  summary: Without `CUSTOMERS:WATCH` — identity omitted, everything else unchanged (AC-09a)
                  value:
                    - id: "00000000-0000-4000-8000-000000000601"
                      itemId: "00000000-0000-4000-8000-000000000101"
                      quantity: 100
                      outstandingQuantity: 40
                      neededBy: "2026-09-20"
                      state: "unfulfilled"
                      cancellationReason: null
                      recordedByUserId: "00000000-0000-4000-8000-000000000001"
                      cancelledByUserId: null
                      cancelledAt: null
                      createdAt: "2026-09-01T10:00:00.000Z"
                      updatedAt: "2026-09-01T10:00:00.000Z"
        "400": { $ref: "#/components/responses/CustomerFilterDenied" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [customer-orders]
      summary: Record a Customer Order, against a Customer or by typed name
      description: |
        Requires `CUSTOMER_ORDERS:CREATE`, declaring `CUSTOMERS:WATCH` **observed** because the
        response carries the customer and the destination back.

        Two mutually exclusive shapes, which is the `chk_customer_orders_customer_identity` check as a
        payload: an order names **a Customer with one of its Delivery Addresses**, or **a typed
        customer name with no address** — never both and never neither.

        - Naming a Customer with no `customerDeliveryAddressId` records the Customer's **current Main**
          address, resolved and stored as a reference at record time; marking a different address Main
          afterwards does not move this order (AC-11).
        - Naming a Customer with an address records the stated one (AC-11).
        - Typing a name records that name, **no** Customer and **no** Delivery Address. No Customer is
          created and none is matched, then or ever (AC-11a). It counts in the consolidated demand
          exactly as an order naming a Customer is counted (AC-24).

        A Customer or a Delivery Address that exists only in another Warehouse of the same Workspace is
        refused **identically to one that does not exist**, and the refusal discloses nothing about
        what exists elsewhere (AC-12). An Inactive Customer, or an Inactive address, is refused.

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: recordCustomerOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerOrderCreate" }
            examples:
              namingACustomer:
                summary: AC-11 — the Customer's Main address is taken when none is stated
                value:
                  itemId: "00000000-0000-4000-8000-000000000101"
                  customerId: "00000000-0000-4000-8000-000000000201"
                  quantity: 100
                  neededBy: "2026-09-20"
              namingACustomerAndAddress:
                summary: AC-11 — a stated address other than the Main one
                value:
                  itemId: "00000000-0000-4000-8000-000000000101"
                  customerId: "00000000-0000-4000-8000-000000000201"
                  customerDeliveryAddressId: "00000000-0000-4000-8000-000000000302"
                  quantity: 100
                  neededBy: "2026-09-20"
              typedName:
                summary: AC-11a — a typed name, no Customer and no Delivery Address
                value:
                  itemId: "00000000-0000-4000-8000-000000000101"
                  customerName: "Test Customer South"
                  quantity: 25
                  neededBy: "2026-09-22"
      responses:
        "201":
          description: The recorded Customer Order with its destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrder" }
              examples:
                namingACustomer:
                  summary: AC-11 — recorded against the Customer's Main Delivery Address
                  value:
                    id: "00000000-0000-4000-8000-000000000601"
                    itemId: "00000000-0000-4000-8000-000000000101"
                    customer:
                      id: "00000000-0000-4000-8000-000000000201"
                      name: "Test Customer North"
                    customerName: null
                    destination:
                      deliveryAddressId: "00000000-0000-4000-8000-000000000301"
                      addressText: "Test Address 1, Test City"
                      accessNotes: "Gate code on the intercom; deliveries 09:00-17:00"
                      isMain: true
                      deactivatedAt: null
                    quantity: 100
                    outstandingQuantity: 100
                    neededBy: "2026-09-20"
                    state: "unfulfilled"
                    cancellationReason: null
                    recordedByUserId: "00000000-0000-4000-8000-000000000001"
                    cancelledByUserId: null
                    cancelledAt: null
                    createdAt: "2026-09-01T10:00:00.000Z"
                    updatedAt: "2026-09-01T10:00:00.000Z"
                typedName:
                  summary: AC-11a — a typed name, no Customer and no Delivery Address
                  value:
                    id: "00000000-0000-4000-8000-000000000602"
                    itemId: "00000000-0000-4000-8000-000000000101"
                    customer: null
                    customerName: "Test Customer South"
                    destination: null
                    quantity: 25
                    outstandingQuantity: 25
                    neededBy: "2026-09-22"
                    state: "unfulfilled"
                    cancellationReason: null
                    recordedByUserId: "00000000-0000-4000-8000-000000000001"
                    cancelledByUserId: null
                    cancelledAt: null
                    createdAt: "2026-09-01T10:05:00.000Z"
                    updatedAt: "2026-09-01T10:05:00.000Z"
        "400": { $ref: "#/components/responses/InvalidCustomerOrderInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerOrderTargetUnavailable" }
        "409": { $ref: "#/components/responses/CustomerOrderDestinationConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customer-orders/{customerOrderId}:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerOrderIdPath"

    patch:
      tags: [customer-orders]
      summary: Amend a Customer Order's quantity or needed-by date
      description: |
        **Changed by this feature: authorization and response only.** The payload is exactly as
        `ordering` shipped it — quantity and needed-by date, neither state nor Outstanding Quantity an
        input. It now declares `CUSTOMERS:WATCH` **observed**, because the order it returns carries the
        customer and the destination.

        **The Delivery Address is deliberately not amendable here.** Redirection is its own
        sub-resource with its own rules — the same Customer, an active address, an outstanding order —
        and a shared payload would let the amendment's validation stand in for the redirection's
        (AC-11c, sad.md §7).

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: amendCustomerOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerOrderAmend" }
            example:
              quantity: 120
      responses:
        "200":
          description: The amended Customer Order, identified or redacted according to the observed Permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrder" }
        "400": { $ref: "#/components/responses/InvalidCustomerOrderInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerOrderTargetUnavailable" }
        "409": { $ref: "#/components/responses/CustomerOrderStateConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/warehouses/{warehouseId}/customer-orders/{customerOrderId}/delivery-address:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/CustomerOrderIdPath"

    put:
      tags: [customer-orders]
      summary: Redirect an outstanding Customer Order to another of its Customer's addresses
      description: |
        Requires `CUSTOMER_ORDERS:UPDATE`, declaring `CUSTOMERS:WATCH` **observed**.

        The Customer Order row is **locked and its state re-read inside the transaction**; the
        eligibility decision is never taken from the value the member composed against (sad.md §6.5).
        Refused — changing nothing — when the named address belongs to another Customer, when it is
        Inactive, or when the order is already Fulfilled or cancelled: an outstanding order is
        redirected only to another **active** Delivery Address of the Customer it **already names**,
        so serving a different customer means recording a new Customer Order (AC-11c). An order
        recorded by typed name names no Customer and is not redirectable.

        The write names **one column on one Customer Order**. No frozen column of any Purchase Draft
        appears in any statement it issues: redirection is not a back door onto a frozen record
        (AC-17, sad.md §8). The Address Drift it causes is **derived on the next read** of the affected
        drafts and is never written by this flow (AC-11b, AC-18).

        `PUT` and idempotent: redirecting to the address the order is already going to changes nothing.

        Mutating: refused while the Warehouse is archived (AC-23), and rate limited.
      operationId: redirectCustomerOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerOrderRedirect" }
            example:
              customerDeliveryAddressId: "00000000-0000-4000-8000-000000000302"
      responses:
        "200":
          description: |
            The Customer Order going to the new address, against the same Customer. Every frozen
            Purchase Draft Line linked to it that was frozen expecting the previous address reports
            Address Drift on its next read (AC-11b).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrder" }
        "400": { $ref: "#/components/responses/InvalidCustomerOrderInput" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "404": { $ref: "#/components/responses/CustomerOrderTargetUnavailable" }
        "409": { $ref: "#/components/responses/CustomerOrderRedirectConflict" }
        "429": { $ref: "#/components/responses/WriteRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  ##########################################################################################
  # Purchase Drafts — Delivery Mode, the freeze, Address Drift, and the per-line endings
  ##########################################################################################

  /api/v1/warehouses/{warehouseId}/purchase-drafts:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    get:
      tags: [purchase-drafts]
      summary: List the Warehouse's Purchase Drafts, flagging Address Drift on directly-shipped lines
      description: |
        **Changed by this feature: authorization and one added field.** Requires
        `PURCHASE_DRAFTS:WATCH` and now declares `CUSTOMERS:WATCH` **observed**.

        For each frozen draft the read compares each link's captured Delivery Address against the
        address that Customer Order is going to **now**. Nothing is stored and no job repairs anything,
        so a redirection is reflected on this read and there is no superseded value to serve
        (spec.md §6 "Address-drift freshness", sad.md §6.9).

        `hasDirectToCustomerAddressDrift` is the new field: it is `true` when a **Direct to Customer**
        line of this draft is linked to a Customer Order now going elsewhere. That case is reported on
        the list itself, where the member sees it without opening anything, because goods are
        travelling to an address nobody now expects them at. The same disagreement on a **Via
        Warehouse** line is reported when the draft is opened — everything on such a line lands at one
        dock either way (AC-18a).

        Neither instructs the member and neither blocks anything. Both stop being reported once the
        Customer Order is redirected back to the address frozen for it.

        `hasDriftSignal` keeps its `ordering` meaning — any link of this draft differing in any
        captured value — and is now also raised by an address disagreement of either mode.

        The summary carries no customer name and no address, so nothing on it is redacted; the observed
        Permission is declared because the operation is part of the identity-bearing draft surface and
        the architecture check requires every such read to declare it (sad.md §8 "Authorization
        coverage").

        Archived-tolerant (AC-23).
      operationId: listPurchaseDrafts
      parameters:
        - in: query
          name: state
          required: false
          schema: { $ref: "#/components/schemas/PurchaseDraftState" }
      responses:
        "200":
          description: The Warehouse's Purchase Drafts, most recently created first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PurchaseDraftSummary" }
              example:
                - id: "00000000-0000-4000-8000-000000000401"
                  reference: "PD-0143"
                  state: "ready_for_ordering"
                  expectedArrivalDate: "2026-09-18"
                  lineCount: 2
                  hasDriftSignal: true
                  hasDirectToCustomerAddressDrift: true
                  closureReason: null
                  createdByUserId: "00000000-0000-4000-8000-000000000001"
                  createdAt: "2026-09-01T11:00:00.000Z"
                  readiedByUserId: "00000000-0000-4000-8000-000000000001"
                  readiedAt: "2026-09-02T09:00:00.000Z"
                  closedByUserId: null
                  closedAt: null
                  arrivalConfirmedByUserId: null
                  arrivalConfirmedAt: null
                  discardedByUserId: null
                  discardedAt: null
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "500": { $ref: "#/components/responses/InternalError" }

