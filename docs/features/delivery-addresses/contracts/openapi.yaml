      summary: Read the Warehouse's frozen lines split by Delivery Mode
      description: |
        Requires `PURCHASE_DRAFTS:WATCH`, declaring `CUSTOMERS:WATCH` **observed**.

        Returns the lines of this Warehouse's drafts with their Delivery Modes, so the lines landing at
        the Warehouse's own Delivery Address are kept apart from those shipping Direct to Customer.
        Each line of a draft holding both modes is listed in whichever half **its own** mode places it,
        so a member preparing the dock sees only the goods they will physically handle (AC-22).

        `deliveryMode` narrows the response to one half. `state` defaults to no filter; the by-line
        view AC-22 describes is `?state=ready_for_ordering`.

        **Served at the top level, not as `/purchase-drafts/lines`**, so no literal segment competes
        with a `{purchaseDraftId}` parameter — the same reason `ordering` serves `/packaging-types` at
        the top level. `tests/refactor/route-table.spec.mjs` asserts no method-and-path pair is served
        twice (sad.md §7).

