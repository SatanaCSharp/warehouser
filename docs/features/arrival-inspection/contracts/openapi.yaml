  /api/v1/warehouses/{warehouseId}/purchase-draft-lines:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    get:
      tags: [purchase-drafts]
      summary: Read the Warehouse's frozen lines split by Delivery Mode, each with its condition breakdown
      description: |
        **Changed by this feature identically to the draft read: the line projection and one further
        observed Permission.** Requires `PURCHASE_DRAFTS:WATCH`, declaring `CUSTOMERS:WATCH` and
        `REJECTIONS:WATCH` **observed**.

        Every rule the draft read states about `ending.condition` — the four shapes, the
        `rejections` array absent as a property rather than emptied, the two `null` cases, and the
        frozen-vs-current catalogue distinction — holds here unchanged. The two reads share one
        projection, and that single point is the mechanism sad.md §4 names: one field on the principal
        consulted by both, rather than two independently maintained redactions.

        `deliveryMode` and `state` narrow the response as before. Nothing is paged.

        Archived-tolerant. Nothing is written.
      operationId: listPurchaseDraftLines
      parameters:
        - in: query
          name: deliveryMode
          required: false
          schema: { $ref: "#/components/schemas/DeliveryMode" }
