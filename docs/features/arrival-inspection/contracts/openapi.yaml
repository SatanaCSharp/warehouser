openapi: 3.1.0

info:
  title: Arrival Inspection API
  version: 0.1.0
  description: |
    `delivery-addresses` split a Purchase Draft's ending per line, so each line now records **how
    much** turned up and who recorded it. Nothing anywhere records **in what state**. Because a
    quantity recorded as arrived may be allocated, and an Allocation reduces a customer's Outstanding
    Quantity, a crushed pallet reduces demand exactly as sound goods do — and the customer learns of
    it by telephone.

    This API adds the condition dimension to that ending and to nothing else. It introduces one piece
    of system reference data (the Rejection Reason catalogue), one child record of a line (the
    Rejection), two judgements written with the ending (the Condition Split and the Pre-receipt
    Conformance), and the product's first write aimed at a **Closed** draft — the amendment of a
    Rejection's description or Disposition.

    Six shapes are load-bearing and readable from the paths below.

    - **The Accepted Quantity is derived and is the only figure an Allocation may draw on.** It is
      `receivedQuantity` less every Rejection on the line, computed by the server and **never
      accepted as input**. There is no field a member can raise to assign more; the only way to assign
      more is to have refused less, which is recorded and attributable (spec.md AC-10, AC-11,
      §6.1 "Refusal as a route around the Allocation bound"). This narrows the bound `ordering` set at
      the received quantity, which is why `DemandAllocationService`'s field becomes
      `assignableQuantity` (sad.md §4, §8 "Naming").
    - **The ending is one atomic act, and a refused submission records no part of itself.** One
      request carries the line's quantity, its Condition Split, its Pre-receipt Conformance and its
      Allocations; all of it is written together or none of it is (spec.md AC-01a, AC-02, §6 "Ending
      atomicity"). The Condition Split and Conformance refusals **collect every violation before
      refusing** rather than short-circuiting on the first — `details.violations` is an array for
      exactly that reason (sad.md §6.1 steps 5–6 and its flag).
    - **The refusing capability is demanded by the payload, not by the operation.** An ending that
      carries at least one Rejection requires `PURCHASE_DRAFTS:RECEIVE` **and** `REJECTIONS:CREATE`;
      an ending that refuses nothing requires only the first (AC-01a, AC-01b). `REJECTIONS:CREATE` is
      declared **observed**, consulted after admission and able only to narrow — it never admits and
      never denies a request the required Permission already settled
      ([ADR 0001](../adr/0001-payload-conditional-permission.md)).
    - **A refusal's cause is a confidentiality boundary, and withholding it leaves no trace.**
      `REJECTIONS:WATCH` is declared **observed** on both reads. Without it a line's condition carries
      ordered, presented, accepted and **one** total refused figure, and the `rejections` array is
      **absent as a property** — no Reason, description, Disposition, count, badge or placeholder
      survives, because a placeholder is itself probeable (AC-22, spec.md §6.1). That a refusal
      happened stays visible wherever presented and accepted differ: the protection is over the cause
      and never over the fact.
    - **The line therefore has four legal shapes, not two.** `CUSTOMERS:WATCH` and `REJECTIONS:WATCH`
      are independent observed grants, so the projection is the product of both — modelled as a
      `oneOf` on the line (customer identity) nested with a `oneOf` on the condition (refusal cause).
      A test matrix covering only two of the four leaves half the projection unproven (sad.md §6.3 and
      its flag, §10).
    - **A Rejection's Source is an input the server refuses when it disagrees with the line.** A Via
      Warehouse line admits only `inspected` and a Direct to Customer line only `customer_reported`
      (AC-24, AC-25). The approved surface derives it and shows it as a chip rather than a field
      (sad.md §6.2), but the contract must let the wrong value be expressed or AC-25's refusal is
      unreachable — see `api-sync-report.md` § Finding 1.

    **Nothing here is asynchronous.** sad.md §6 states the feature introduces no queue, event,
    scheduled job or third-party callback; no §6 diagram carries a `<message-bus>` or
    `<external-system>` participant, and §7 closes with "No queue, event, CLI, SDK or worker interface
    is introduced". So no operation carries an `Idempotency-Key` and **no `events.md` is written** —
    both correctly absent rather than missing.

    **Lists are returned whole and deterministically ordered, not paged.** spec.md §1's sixth boundary
    fixes the scale: "the §6 targets assume the volumes `ordering` already assumes, at which every
    list this feature touches is returned whole rather than in pages, because this release adds no
    list of its own." See `api-sync-report.md` § "Recorded deviations".

    **Scope of this document.** It restates the two operations this feature adds and the four whose
    request, response or declared Permissions it changes. Every other `ordering` and
    `delivery-addresses` operation is unchanged and stays governed by
    [`delivery-addresses/contracts/openapi.yaml`](../../delivery-addresses/contracts/openapi.yaml) and
    [`ordering/contracts/openapi.yaml`](../../ordering/contracts/openapi.yaml). Schemas restated here
    without change carry an "Unchanged from …" note, following the convention `delivery-addresses`
    set over `ordering`.

servers:
  - url: http://localhost:3000
    description: Local development

# Every operation requires the session cookie issued by `POST /api/v1/auth/sign-up` and
# `POST /api/v1/auth/sign-in`. This feature introduces no public endpoint, so no operation
# overrides with `security: []`. Authentication grants no authority: a valid session with no
# membership in the named Warehouse is denied every capability here, reads included (AC-26).
security:
  - SessionCookie: []

tags:
  - name: purchase-drafts
    description: |
      The Rejection Reason catalogue, the two per-line endings extended with their condition, the
      amendment of one Rejection, and the two reads that carry a line's condition breakdown.

      There is no `rejections` tag and no `rejections` module on either side of the stack: a Rejection
      has no life apart from the line's ending that carries it, so `purchase-drafts` owns it and the
      `REJECTIONS:` prefix names a **capability**, not a module (sad.md §4, §8 "Naming") — exactly as
      `ITEM_STOCK:ADJUST` does inside `items`.

paths:
  ##########################################################################################
  # The Rejection Reason catalogue — system reference data, read-only, unscoped by Warehouse
  ##########################################################################################

  /api/v1/warehouses/{warehouseId}/rejection-reasons:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"

    get:
      tags: [purchase-drafts]
      summary: Read the Rejection Reason catalogue
      description: |
        **New.** The system-managed catalogue one Rejection's Reason is chosen from. Requires
        `PURCHASE_DRAFTS:WATCH` — the same Permission the Packaging Type catalogue is read under, and
        the one a member composing an ending already holds.

        **There is no mutation handler, and there never will be one.** Members neither create, rename
        nor retire an entry: the catalogue is seeded and **extended only** through migrations, and
        extension is the only change it admits. That is stronger than the Packaging Type rule and it
        is why a Rejection **names** its Reason rather than copying the wording — no wording ever
        changes beneath a recorded Rejection, so AC-23a needs no frozen column (data-model.md
        `rejection_reasons`, CONTEXT.md §Invariants). Half the rule is a database fact
        (`fk_purchase_draft_line_rejections_reason` is `ON DELETE RESTRICT`, so a named Reason cannot
        be deleted by anything, a migration included); the other half is the architecture check
        sad.md §10 requires, asserting that no migration updates or deletes a row here.

        **Workspace-wide, and returned whole.** It takes no Warehouse scope and nothing filters it: the
        `{warehouseId}` in the path is what `WarehouseAccessGuard` resolves authority from, not a
        narrowing of the data (sad.md §6.5). At ten rows there is nothing to page.

        Served at `/rejection-reasons` rather than under `/purchase-drafts/` so no literal segment
        competes with a `{purchaseDraftId}` parameter — the same reason `ordering` serves
        `/packaging-types` at the top level, and why `PackagingTypesController` is its own controller
        (sad.md §7).

        Archived-tolerant: a member whose Role carries `PURCHASE_DRAFTS:WATCH` reads the catalogue of
        an archived Warehouse exactly as before archiving.
      operationId: listRejectionReasons
      responses:
        "200":
          description: |
            The catalogue whole, ordered by `id` — the primary key, and the access path data-model.md
            records for this read. `requiresDescription` is what the surface uses to demand the
            member's prose **before** the ending may be submitted, and what the server asserts AC-07
            against; it is catalogue **data** rather than a hard-coded `unfit_other`, so the next
            prose-requiring Reason is one migration row and not a client release (sad.md §4,
            data-model.md `rejection_reasons`).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RejectionReason" }
              example:
                - id: "damaged_by_packing"
                  label: "Damaged by packing"
                  requiresDescription: false
                - id: "damaged_in_transit"
                  label: "Damaged in transit"
                  requiresDescription: false
                - id: "documentation_missing"
                  label: "Documentation missing"
                  requiresDescription: false
                - id: "packaging_not_as_instructed"
                  label: "Packaging not as instructed"
                  requiresDescription: false
                - id: "quality_defect"
                  label: "Quality defect"
                  requiresDescription: false
                - id: "shelf_life_insufficient"
                  label: "Shelf life insufficient"
                  requiresDescription: false
                - id: "short_within_packaging"
                  label: "Short within packaging"
                  requiresDescription: false
                - id: "unfit_other"
                  label: "Unfit — other"
                  requiresDescription: true
                - id: "value_adding_note_not_applied"
                  label: "Value-adding note not applied"
                  requiresDescription: false
                - id: "wrong_item_supplied"
                  label: "Wrong item supplied"
                  requiresDescription: false
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/WarehouseDenied" }
        "500": { $ref: "#/components/responses/InternalError" }

  ##########################################################################################
  # Reading a draft's condition — four shapes, two observed Permissions
  ##########################################################################################

  /api/v1/warehouses/{warehouseId}/purchase-drafts/{purchaseDraftId}:
    parameters:
      - $ref: "#/components/parameters/WarehouseIdPath"
      - $ref: "#/components/parameters/PurchaseDraftIdPath"

    get:
      tags: [purchase-drafts]
      summary: Read one Purchase Draft with each line's condition breakdown
      description: |
        **Changed by this feature: the line projection and one further observed Permission.** Requires
        `PURCHASE_DRAFTS:WATCH`, declaring **both** `CUSTOMERS:WATCH` (unchanged, from
        `delivery-addresses`) and `REJECTIONS:WATCH` (new) as **observed** Permissions.

        Each line whose ending recorded a Condition Split now carries `ending.condition`: what the
        supplier presented, the derived Accepted Quantity, the derived Rejected Quantity, the
        Pre-receipt Conformance, and each refused quantity beside its Reason, description, Source and
        Disposition (AC-21). All of it is built in the query that already assembles the line's links
        and drift, not in a second one — which is what keeps the 250 ms p95 budget honest (sad.md §8).

        **Neither observed grant can admit or deny this read; each only narrows what it carries, and
        they are independent — so the line has four legal shapes** (sad.md §6.3):

        | `CUSTOMERS:WATCH` | `REJECTIONS:WATCH` | Shape |
        | --- | --- | --- |
        | held | held | the whole account and the customer half of the line (AC-21, AC-23, AC-23a) |
        | held | absent | the customer half, and the condition **without cause** (AC-22) |
        | absent | held | the whole condition account, customer half withheld as `delivery-addresses` already withholds it |
        | absent | absent | both withheld |

        **The cause-withheld form omits the `rejections` array as a property rather than emptying
        it.** No Reason, description, Disposition, count, badge or placeholder survives, and nothing
        indicates that anything was withheld — the withheld columns are not selected at all. A
        placeholder or a count would itself be a disclosure that can be probed, and the number of
        distinct refusals on a line is exactly what spec.md §6.1 protects (AC-22, sad.md §8). That a
        refusal happened stays visible, because `receivedQuantity` and `acceptedQuantity` differ.

        **`ending.condition` is `null` in two correct cases, and they read alike.** A line where
        **nothing was received** records neither judgement (AC-04a), and an ending recorded **before
        this release** was left untouched and carries neither either (spec.md §8, tenth question). The
        discriminator is the Conformance verdict's absence, not the absence of Rejections — both cases
        share that. Such a line's Accepted Quantity equals its Received Quantity, which is exactly the
        treatment the Allocation bound was told to give it (data-model.md § Derived quantities).

        **What the catalogue reads now cannot rewrite what was recorded.** `packagingTypeId` is the
        type **frozen on the line** when it was ordered, whatever the Packaging Type catalogue reads
        today (AC-23); `rejectionReasonLabel` is the Rejection Reason catalogue's current wording,
        which **is** the wording the member stated, because that catalogue is extended only and no
        entry is ever reworded (AC-23a). The two hold for opposite reasons, and neither is an accident.

        A draft of a Warehouse the actor is not acting in fails identically to one that does not
        exist, disclosing nothing about whether it exists (AC-26).

        Archived-tolerant. Nothing is written.
      operationId: readPurchaseDraft
      responses:
        "200":
          description: The draft, its lines, their destinations, their links and each line's condition breakdown in whichever of the four shapes the actor's observed grants select.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseDraftDetail" }
              examples:
                bothGrantsHeld:
                  summary: AC-21 — `CUSTOMERS:WATCH` and `REJECTIONS:WATCH` both held
                  value:
                    id: "00000000-0000-4000-8000-000000000401"
                    reference: "PD-0143"
