packages:
  - "apps/*"
  - "packages/*"

# Install only database drivers declared by a workspace package. TypeORM advertises optional peers
# for every supported database; auto-installing them would pull MongoDB back into this PostgreSQL-only repo.
autoInstallPeers: false

overrides:
  "@types/node": "catalog:"
  "brace-expansion@1.1.15": "1.1.16"
  "brace-expansion@5.0.7": "5.0.8"
  "fast-uri@3.1.3": "3.1.4"
  "postcss@8.5.16": "8.5.18"

catalog:
  # TypeScript & build
  tsc-alias: ^1.9.0
  turbo: ^2.10.4
  typescript: ^5.9.3

  # Testing
  "@types/jest": ^29.5.14
  "@types/node": ^24.13.3
  "@testing-library/dom": ^10.4.1
  jest: ^29.7.0
  ts-jest: ^29.4.11
  ts-node: ^10.9.2
  vitest: ^3.2.7

  # NestJS
  "@nestjs/cli": ^11.0.24
  "@nestjs/common": ^11.1.28
  "@nestjs/bullmq": ^11.0.4
  "@nestjs/config": ^4.0.4
  "@nestjs/core": ^11.1.28
  "@nestjs/jwt": ^11.0.2
  "@nestjs/typeorm": ^11.0.0
  "@nestjs/passport": ^11.0.5
  "@nestjs/platform-express": ^11.1.28
  "@nestjs/testing": ^11.1.28

  # Server runtime
  bullmq: ^5.81.1
  nestjs-pino: ^4.6.1
  pg: ^8.16.3
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  passport: ^0.7.0
  passport-jwt: ^4.0.1
  passport-local: ^1.0.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  typeorm: ^0.3.27

  # Contracts / validation
  nestjs-zod: ^5.4.0
  zod: ^4.4.3

  # Server types
  "@types/passport-jwt": ^4.0.1
  "@types/passport-local": ^1.0.38

  # React
  "@reduxjs/toolkit": ^2.12.0
  "@tanstack/react-router": ^1.170.17
  react: ^19.2.7
  react-dom: ^19.2.7
  react-redux: ^9.3.0

  # React types
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  # Vite
  "@vitejs/plugin-react": ^4.7.0
  vite: ^6.4.3

  # ESLint core
  "@eslint/js": ^9.39.5
  "@typescript-eslint/eslint-plugin": ^8.63.0
  "@typescript-eslint/parser": ^8.63.0
  eslint: ^9.39.5
  typescript-eslint: ^8.63.0

  # ESLint plugins
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^3.10.1
  eslint-plugin-import: ^2.32.0
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-no-relative-import-paths: ^1.6.1
  eslint-plugin-prettier: ^5.5.6
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-simple-import-sort: ^12.1.1
  eslint-plugin-unused-imports: ^4.4.1

  # ESLint types
  "@types/eslint-plugin-jsx-a11y": ^6.10.1
