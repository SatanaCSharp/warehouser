packages:
  - "apps/*"
  - "packages/*"

# Install only database drivers declared by a workspace package. TypeORM advertises optional peers
# for every supported database; auto-installing them would pull MongoDB back into this PostgreSQL-only repo.
autoInstallPeers: false

# `@heroui/react@3.2.4` imports `@internationalized/date` from its own `utils/calendar.js` (every
# Calendar / DateField / DatePicker path) without declaring it, so pnpm's strict layout cannot
# resolve it. Declaring the missing peer rather than a dependency keeps one instance of the package:
# it resolves from `apps/web`, which is the same copy `react-aria-components` gets.
packageExtensions:
  "@heroui/react":
    peerDependencies:
      "@internationalized/date": "^3.12.3"

# `nestjs-zod@5.5.0` was published a month before NestJS 12 shipped, so its peer range still stops at
# `@nestjs/common ^11` even though nothing it uses changed in v12: it imports only stable public
# `@nestjs/common` API, never `@nestjs/core` (it reaches the reflector through the
# `Inject('Reflector')` string token, which `@nestjs/core@12` still registers), does not extend Nest's
# `ValidationPipe`, and reads `ArgumentMetadata` structurally rather than by name. Accepting v12 for
# this one edge records that judgement instead of leaving a standing install warning; drop the rule
# once upstream widens the range, or once the dependency is replaced by Nest 12's own
# `@Body({ schema })` + `StandardSchemaValidationPipe`.
#
# This is deliberately a `peerDependencyRules` entry and not a `packageExtensions` one: pnpm merges an
# extension as `{ ...extension[field], ...manifest[field] }`, so a package's own declaration always
# wins and an extension can only add a peer the package never declared (which is what the
# `@heroui/react` entry above does). It cannot widen a range the package already states.
peerDependencyRules:
  allowedVersions:
    "nestjs-zod>@nestjs/common": "^12.0.0"

overrides:
  "@types/node": "catalog:"
  "brace-expansion@1.1.15": "1.1.16"
  "brace-expansion@5.0.7": "5.0.8"
  "fast-uri@3.1.3": "3.1.4"
  "postcss@8.5.16": "8.5.18"

catalog:
  # TypeScript & build
  # 1.9.4 or newer: earlier releases drop a bare `"*"` `paths` key on the floor
  # (`buildAliasTrie` skipped any alias whose prefix was empty), so `apps/server`'s emitted
  # `shared/...` specifiers were left unrewritten and the built output did not load.
  tsc-alias: ^1.9.4
  turbo: ^2.10.4
  typescript: ^5.9.3
  # `apps/server` is ESM and builds with `tsc` + `tsc-alias`, so there is no bundler-backed watch
  # mode to lean on. `tsx` runs the TypeScript entrypoint directly and restarts it on change — the
  # maintained replacement for `nest start --watch`, whose tsconfig-paths hook cannot emit loadable
  # ESM.
  tsx: ^4.23.13

  # Testing
  "@types/node": ^24.13.3
  "@testing-library/dom": ^10.4.1
  vitest: ^5.0.0
  "@vitest/coverage-v8": ^5.0.0
  # NestJS DI needs `emitDecoratorMetadata`, which esbuild (Vite's default
  # transform) cannot emit. The server test tiers compile with SWC instead.
  "@swc/core": ^1.16.2
  unplugin-swc: ^1.6.0
  # Replaces Jest's `moduleDirectories`: resolves the bare `shared/...`
  # specifiers against the server's tsconfig.
  vite-tsconfig-paths: ^6.1.1

  # NestJS. Every v12 package publishes as ESM (`"type": "module"`), and so does `apps/server`, so
  # they are reached by a plain `import`. The Nest CLI is deliberately absent: its tsconfig-paths
  # transformer strips the extension off every alias it rewrites, producing specifiers Node's ESM
  # resolver cannot load (nest-cli#3545), and the repo has no `nest-cli.json`, so the CLI
  # contributed nothing else. `apps/server` builds with `tsc` + `tsc-alias` instead.
  "@nestjs/common": ^12.0.1
  "@nestjs/bullmq": ^12.0.0
  "@nestjs/config": ^12.0.0
  "@nestjs/core": ^12.0.1
  "@nestjs/jwt": ^12.0.1
  "@nestjs/typeorm": ^12.0.1
  "@nestjs/passport": ^12.0.0
  "@nestjs/platform-express": ^12.0.1
  "@nestjs/testing": ^12.0.1

  # Server runtime
  bullmq: ^5.81.1
  # v5 is the first release whose `@nestjs/{common,core}` peers accept ^12; its `pino`/`pino-http`
  # peers (^10 / ^11) are already satisfied by the two entries below, so this bump cascades nowhere.
  nestjs-pino: ^5.1.0
  pg: ^8.16.3
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  passport: ^0.7.0
  passport-jwt: ^4.0.1
  passport-local: ^1.0.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  typeorm: ^0.3.27

  # Contracts / validation
  nestjs-zod: ^5.5.0
  zod: ^4.4.3

  # Server types
  "@types/passport-jwt": ^4.0.1
  "@types/passport-local": ^1.0.38

  # React
  "@reduxjs/toolkit": ^2.12.0
  "@tanstack/react-router": ^1.170.17
  react: ^19.2.7
  react-dom: ^19.2.7
  react-redux: ^9.3.0

  # React types
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  # Vite
  "@vitejs/plugin-react": ^4.7.0
  vite: ^6.4.3

  # ESLint core
  "@eslint/js": ^9.39.5
  "@typescript-eslint/eslint-plugin": ^8.63.0
  "@typescript-eslint/parser": ^8.63.0
  eslint: ^9.39.5
  typescript-eslint: ^8.63.0

  # ESLint plugins
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^3.10.1
  eslint-plugin-import: ^2.32.0
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-no-relative-import-paths: ^1.6.1
  eslint-plugin-prettier: ^5.5.6
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-simple-import-sort: ^12.1.1
  eslint-plugin-unused-imports: ^4.4.1

  # ESLint types
  "@types/eslint-plugin-jsx-a11y": ^6.10.1
